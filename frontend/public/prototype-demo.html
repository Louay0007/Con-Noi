<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banking App Onboarding Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; color: #1a1a1a; }
    .app { max-width: 420px; margin: 0 auto; padding: 24px; }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo h1 { font-size: 24px; font-weight: 700; color: #0F1E3D; }
    .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 16px; }
    h2 { font-size: 18px; font-weight: 600; margin-bottom: 16px; color: #0F1E3D; }
    .input-group { margin-bottom: 16px; }
    label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: #374151; }
    input { width: 100%; padding: 12px 16px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 15px; }
    input:focus { outline: none; border-color: #1E3A8A; box-shadow: 0 0 0 3px rgba(30,58,138,0.2); }
    .pin-inputs { display: flex; gap: 10px; margin-top: 8px; }
    .pin-inputs input { flex: 1; text-align: center; font-size: 20px; font-weight: 600; padding: 16px 8px; }
    .btn-primary { width: 100%; padding: 14px; background: #1E3A8A; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-primary:disabled { background: #9ca3af; cursor: not-allowed; }
    .progress { display: flex; justify-content: center; gap: 6px; margin-bottom: 24px; }
    .progress-dot { width: 8px; height: 8px; border-radius: 50%; background: #d1d5db; }
    .progress-dot.active { background: #1E3A8A; }
    .step-indicator { text-align: center; font-size: 13px; color: #6b7280; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="logo">
      <h1>Elseview Bank</h1>
    </div>
    <div class="progress">
      <div class="progress-dot active"></div>
      <div class="progress-dot"></div>
      <div class="progress-dot"></div>
    </div>
    <div class="step-indicator">Step 1 of 3</div>
    
    <div class="card">
      <h2>Create your account</h2>
      <div class="input-group">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" placeholder="(555) 123-4567" value="(555) 123-4567">
      </div>
      <div class="input-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" value="you@example.com">
      </div>
      <div class="input-group">
        <label for="name">Full name</label>
        <input type="text" id="name" placeholder="Jane Doe" value="Jane Doe">
      </div>
      <button class="btn-primary" id="next-btn">Continue</button>
    </div>
    
    <div class="card">
      <h2>Set up 4-digit PIN</h2>
      <p style="font-size:14px;color:#6b7280;margin-bottom:16px;">Choose a secure 4-digit PIN</p>
      <div class="pin-inputs">
        <input type="password" maxlength="1" inputmode="numeric">
        <input type="password" maxlength="1" inputmode="numeric">
        <input type="password" maxlength="1" inputmode="numeric">
        <input type="password" maxlength="1" inputmode="numeric">
      </div>
    </div>
  </div>

  <script>
    document.getElementById('next-btn').addEventListener('click', function() {
      const dots = document.querySelectorAll('.progress-dot');
      dots[0].classList.remove('active');
      dots[1].classList.add('active');
      document.querySelector('.step-indicator').textContent = 'Step 2 of 3';
      document.querySelector('h2').textContent = 'Verify your phone';
      document.querySelector('.btn-primary').textContent = 'Get code';
    });
  </script>
</body>
</html>
